obs_config:
  sensors:
    base_ang_vel:
      shape:
      - 3
      obs_scale: 0.25
      frames: 8
      stride: 1
    projected_gravity:
      shape:
      - 3
      obs_scale: 1.0
      frames: 8
      stride: 1
    velocity_commands:
      shape:
      - 3
      obs_scale: 1.0
      frames: 8
      stride: 1
    joint_pos:
      shape:
      - 29
      obs_scale: 1.0
      frames: 8
      stride: 1
    joint_vel:
      shape:
      - 29
      obs_scale: 0.05
      frames: 8
      stride: 1
    actions:
      shape:
      - 29
      obs_scale: 1.0
      frames: 8
      stride: 1
    depth:
      shape:
      - 18
      - 32
      obs_scale: 1.0
      frames: 8
      stride: 5
  proprio_obs:
    sources:
    - base_ang_vel
    - projected_gravity
    - velocity_commands
    - joint_pos
    - joint_vel
    - actions
    history_len: 1
    tail_ndim: 0
    history_mode: merge
  enc_input:
    sources:
    - depth
    history_len: 1
    tail_ndim: 2
    history_mode: merge
deploy_obs_heads:
- enc_input
- proprio_obs
pd_rate: 200.0
infer_rate: 50.
clip_actions: 1000.0
clip_obs: 1000.
exp_avg_decay: 1.0
