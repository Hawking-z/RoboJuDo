
num_actions: 29
dof_config:
  isaac_order:
  - left_hip_pitch_joint
  - right_hip_pitch_joint
  - waist_yaw_joint
  - left_hip_roll_joint
  - right_hip_roll_joint
  - waist_roll_joint
  - left_hip_yaw_joint
  - right_hip_yaw_joint
  - waist_pitch_joint
  - left_knee_joint
  - right_knee_joint
  - left_shoulder_pitch_joint
  - right_shoulder_pitch_joint
  - left_ankle_pitch_joint
  - right_ankle_pitch_joint
  - left_shoulder_roll_joint
  - right_shoulder_roll_joint
  - left_ankle_roll_joint
  - right_ankle_roll_joint
  - left_shoulder_yaw_joint
  - right_shoulder_yaw_joint
  - left_elbow_joint
  - right_elbow_joint
  - left_wrist_roll_joint
  - right_wrist_roll_joint
  - left_wrist_pitch_joint
  - right_wrist_pitch_joint
  - left_wrist_yaw_joint
  - right_wrist_yaw_joint

  ".*":
    action_scale: 0.25

  ".*_hip_.*_joint":
    kp: 100.0
    kd: 2.0
    torque_limits: 139.0
    default_pos: 0.0

  ".*_hip_yaw_joint":
    torque_limits: 88.0

  ".*_hip_pitch_joint":
    default_pos: -0.1

  ".*_knee_joint":
    kp: 150.0
    kd: 4.0
    torque_limits: 139.0
    default_pos: 0.3

  ".*_ankle_.*_joint":
    kp: 40.0
    kd: 2.0
    torque_limits: 35.0
    default_pos: 0.0

  ".*_ankle_pitch_joint":
    default_pos: -0.2

  "waist_.*_joint":
    kp: 40.0
    kd: 5.0
    torque_limits: 35.0
    default_pos: 0.0

  "waist_yaw_joint":
    kp: 200.0
    torque_limits: 88.0

  ".*_shoulder_.*_joint":
    kp: 40.0
    kd: 10.0
    torque_limits: 25.0
    default_pos: 0.0

  ".*_shoulder_pitch_joint":
    default_pos: 0.3

  "left_shoulder_roll_joint":
    default_pos: 0.25

  "right_shoulder_roll_joint":
    default_pos: -0.25

  ".*_elbow_joint":
    kp: 40.0
    kd: 10.0
    torque_limits: 25.0
    default_pos: 0.97

  ".*_wrist_roll_joint":
    kp: 40.0
    kd: 10.0
    torque_limits: 25.0
    default_pos: 0.0

  "left_wrist_roll_joint":
    default_pos: 0.15

  "right_wrist_roll_joint":
    default_pos: -0.15

  ".*_wrist_(pitch|yaw)_joint":
    kp: 40.0
    kd: 10.0
    torque_limits: 13.4
    default_pos: 0.0


obs_config:
  sensors:
    base_ang_vel:
      shape:
      - 3
      obs_scale: 0.2
      frames: 5
      stride: 1
    projected_gravity:
      shape:
      - 3
      obs_scale: 1.0
      frames: 5
      stride: 1
    commands:
      shape:
      - 3
      obs_scale: 1.0
      frames: 5
      stride: 1
    dof_pos:
      shape:
      - 29
      obs_scale: 1.0
      frames: 5
      stride: 1
    dof_vel:
      shape:
      - 29
      obs_scale: 0.05
      frames: 5
      stride: 1
    actions:
      shape:
      - 29
      obs_scale: 1.0
      frames: 5
      stride: 1
  actor_obs:
    sources:
    - base_ang_vel
    - projected_gravity
    - commands
    - dof_pos
    - dof_vel
    - actions
    history_len: 1
    tail_ndim: 0
    history_mode: merge
pd_rate: 200.0
infer_rate: 50.
clip_actions: 0.0
clip_obs: 0.0
exp_avg_decay: 1.0
gait:
  gait_air_ratio_l: 0.45
  gait_air_ratio_r: 0.45
  gait_cycle: 0.8
  gait_delta_t: 0.02
  gait_phase_offset_l: 0.0
  gait_phase_offset_r: 0.5
